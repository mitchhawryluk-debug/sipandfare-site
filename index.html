<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sip and Fare</title>
<meta name="description" content="Sip and Fare builds branded loyalty apps for independent cafés, drink shops, and food trucks.">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #1a1410;
    --text: #f0e8d8;
    --muted: #a08060;
    --accent: #c8843a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap {
    max-width: 560px;
  }
  .mark {
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    font-weight: 600;
  }
  h1 {
    font-size: clamp(32px, 6vw, 48px);
    margin: 0 0 16px;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  p.tagline {
    font-size: 18px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 32px;
  }
  .status {
    display: inline-block;
    font-size: 13px;
    color: var(--muted);
    border: 1px solid rgba(160, 128, 96, 0.4);
    border-radius: 999px;
    padding: 6px 16px;
    margin-bottom: 32px;
  }
  a.contact {
    color: var(--accent);
    text-decoration: none;
    font-size: 15px;
    border-bottom: 1px solid rgba(200, 132, 58, 0.4);
    padding-bottom: 2px;
  }
  a.contact:hover {
    border-bottom-color: var(--accent);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Sip and Fare</div>
    <h1>Branded loyalty apps for independent food &amp; drink businesses</h1>
    <p class="tagline">Cafés, drink shops, food trucks — we build and run the rewards app behind the counter. One platform, your own branding, no per-store infrastructure to manage.</p>
    <div class="status">Site coming soon</div>
    <div>
      <a class="contact" href="mailto:sales@sipandfare.com">sales@sipandfare.com</a>
    </div>
  </div>
</body>
</html>
